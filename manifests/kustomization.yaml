apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chirpstack
resources:
  - ./resources/namespace.yaml
  - ./resources/deployment.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: chirpstack-simulator-config
    files:
      - config.toml=./config.toml
    type: Opaque
